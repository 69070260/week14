<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>Profile Card & To-do List</title>
    <style>
        body {
            background-color: #f0f0f0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            font-family: sans-serif;
        }

        .card {
            background-color: #ffffff;
            border-radius: 10px;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.15);
            display: flex;
            padding: 20px;
            width: 600px;
        }

        .profile {
            width: 50%;
            padding-right: 15px;
        }

        .todo {
            width: 50%;
            padding-left: 15px;
            border-left: 1px solid #ccc;
        }

        ul {
            list-style: none;
            padding-left: 0;
        }

        li {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            padding: 4px 0;
            border-bottom: 1px dashed #eee;
        }

        button {
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="card">
        
        <div class="profile">
            <img src="image.png" alt="รูปโปรไฟล์" width="100">
            <h2>Takdanai Nakavanitvetchasit</h2>
            <p>69070260 / IT KMITL</p>
            <p>POM LUK MYGIRLFRIEND T SOOD NAI ROOKKKKK!!!</p>
            <a href="https://www.instagram.com/bosstakdanai/" target="_blank">ช่องทางติดต่อ Instagram</a>
        </div>

        <div class="todo">
            <h2>To-do List</h2>
            <input type="text" id="todo-input" placeholder="พิมพ์สิ่งที่ต้องทำ...">
            <button id="add-btn">เพิ่ม</button>

            <ul id="todo-list"></ul>
        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
