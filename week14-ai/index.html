<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Takdanai's Profile & To-do List</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Prompt & Poppins -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body {
            font-family: 'Prompt', 'Poppins', sans-serif;
            background-color: #0c0408;
            background-image: 
                radial-gradient(circle at 15% 20%, rgba(225, 29, 72, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 85% 80%, rgba(244, 63, 94, 0.12) 0%, transparent 40%),
                radial-gradient(circle at 50% 50%, rgba(159, 18, 57, 0.08) 0%, transparent 60%);
            min-height: 100vh;
        }

        /* Glassmorphism Card Effect */
        .glass-card {
            background: linear-gradient(135deg, rgba(28, 10, 20, 0.85) 0%, rgba(18, 6, 13, 0.92) 100%);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(244, 63, 94, 0.25);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6),
                        0 0 30px rgba(225, 29, 72, 0.15);
        }

        /* Gradient Borders and Buttons */
        .pink-red-gradient {
            background: linear-gradient(135deg, #e11d48 0%, #be123c 50%, #881337 100%);
        }

        .pink-red-gradient:hover {
            background: linear-gradient(135deg, #f43f5e 0%, #e11d48 50%, #9f1239 100%);
        }

        .delete-gradient {
            background: rgba(225, 29, 72, 0.15);
            border: 1px solid rgba(244, 63, 94, 0.3);
            color: #fda4af;
        }

        .delete-gradient:hover {
            background: rgba(225, 29, 72, 0.35);
            border-color: rgba(244, 63, 94, 0.6);
            color: #ffffff;
        }

        /* Profile Image Frame Glow */
        .profile-frame {
            box-shadow: 0 0 25px rgba(244, 63, 94, 0.35);
            border: 3px solid rgba(244, 63, 94, 0.5);
        }

        /* Input Glow */
        .custom-input {
            background-color: rgba(15, 5, 10, 0.7);
            border: 1px solid rgba(244, 63, 94, 0.3);
            color: #ffe4e6;
            transition: all 0.3s ease;
        }

        .custom-input:focus {
            outline: none;
            border-color: #f43f5e;
            box-shadow: 0 0 15px rgba(244, 63, 94, 0.3);
        }

        /* Custom Scrollbar for list */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(20, 5, 12, 0.5);
            border-radius: 8px;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(225, 29, 72, 0.4);
            border-radius: 8px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(244, 63, 94, 0.7);
        }
    </style>
</head>
<body class="flex items-center justify-center p-4 md:p-8">

    <!-- Container Card -->
    <div class="glass-card w-full max-w-4xl rounded-3xl p-6 md:p-10 text-rose-100 my-auto">
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-8 items-stretch">
            
            <!-- ================= ฝั่งซ้าย: PROFILE ================= -->
            <div class="lg:col-span-5 flex flex-col items-center text-center p-6 rounded-2xl bg-gradient-to-b from-rose-950/20 to-black/40 border border-rose-900/30 relative overflow-hidden group">
                <div class="absolute -top-12 -left-12 w-32 h-32 bg-rose-600/20 rounded-full blur-2xl"></div>
                <div class="absolute -bottom-12 -right-12 w-32 h-32 bg-pink-600/20 rounded-full blur-2xl"></div>

                <div class="relative mb-5 mt-2">
                    <img src="image.png" 
                         alt="Takdanai Profile" 
                         onerror="this.onerror=null; this.src='https://placehold.co/300x300/1e0a14/f43f5e?text=Takdanai';"
                         class="profile-frame w-36 h-36 md:w-44 md:h-44 object-cover rounded-full transform group-hover:scale-105 transition duration-500">
                    <span class="absolute bottom-2 right-2 w-5 h-5 bg-rose-500 border-2 border-slate-900 rounded-full" title="Online"></span>
                </div>

                <h1 class="text-xl md:text-2xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-rose-200 via-pink-400 to-rose-500 mb-2 leading-tight">
                    Takdanai Nakavanitvetchasit
                </h1>

                <p class="text-xs md:text-sm font-medium text-rose-300/90 bg-rose-950/50 px-3 py-1 rounded-full border border-rose-800/40 mb-3">
                    <i class="fa-solid font-mono text-rose-400 mr-1.5"></i>69070260 IT KMITL
                </p>

                <p class="text-sm md:text-base text-pink-200 font-semibold my-2 flex items-center justify-center gap-2">
                    <i class="fa-solid fa-heart text-rose-500 animate-pulse"></i>
                    I LOVE MY GIRLFRIEND
                    <i class="fa-solid fa-heart text-rose-500 animate-pulse"></i>
                </p>

                <div class="w-full my-4 border-t border-rose-900/40"></div>

                <div class="mt-auto w-full">
                    <a href="https://www.instagram.com/bosstakdanai/" 
                       target="_blank" 
                       rel="noopener noreferrer" 
                       class="inline-flex items-center justify-center gap-2 w-full py-2.5 px-4 rounded-xl text-xs md:text-sm font-medium text-pink-200 bg-rose-950/40 hover:bg-rose-900/50 border border-rose-800/50 hover:border-rose-500 transition duration-300 break-all group/link">
                        <i class="fa-brands fa-instagram text-base text-pink-400 group-hover/link:scale-110 transition duration-300"></i>
                        <span>https://www.instagram.com/bosstakdanai/</span>
                    </a>
                </div>
            </div>

            <!-- ================= ฝั่งขวา: TO-DO LIST ================= -->
            <div class="lg:col-span-7 flex flex-col p-6 rounded-2xl bg-gradient-to-b from-rose-950/10 to-black/30 border border-rose-900/20">
                
                <div class="flex items-center justify-between mb-6 pb-3 border-b border-rose-900/40">
                    <h2 class="text-xl md:text-2xl font-bold text-rose-100 flex items-center gap-2">
                        <i class="fa-solid fa-list-check text-rose-500"></i>
                        To-do List
                    </h2>
                    <!-- Badge นับจำนวนรายการแบบ Dynamic -->
                    <span id="todo-count" class="text-xs text-rose-400 bg-rose-950 px-2.5 py-1 rounded-full border border-rose-800/50">
                        0 รายการ
                    </span>
                </div>

                <!-- Input และ ปุ่มเพิ่ม -->
                <div class="flex gap-2 mb-6">
                    <input type="text" 
                           id="todo-input"
                           placeholder="พิมพ์สิ่งที่ต้องทำ..." 
                           class="custom-input flex-1 px-4 py-3 rounded-xl text-sm placeholder-rose-400/50">
                    <button id="add-btn" class="pink-red-gradient text-white font-medium px-5 py-3 rounded-xl text-sm shadow-lg shadow-rose-950/50 transition duration-200 flex items-center gap-1.5 shrink-0 active:scale-95">
                        <i class="fa-solid fa-plus text-xs"></i>
                        เพิ่ม
                    </button>
                </div>

                <!-- พื้นที่แสดงผลรายการ To-do List -->
                <ul id="todo-list" class="space-y-3 overflow-y-auto max-h-[320px] pr-1 flex-1"></ul>

            </div>

        </div>
    </div>

    <!-- เชื่อมต่อสคริปต์ JavaScript -->
    <script src="script.js"></script>
</body>
</html>
